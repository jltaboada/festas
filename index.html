<!DOCTYPE html>
<html lang="gl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Festas de Ourense 2026 · Programa</title>
<meta name="description" content="Programa das Festas de Ourense 2026 · do 17 ao 21 de xuño. Concertos, espectáculos, atraccións e actividades día a día. Garda favoritos, engade ao calendario e abre as localizacións no mapa. Galego e castelán. Proxecto persoal de jltaboada.">
<meta name="theme-color" content="#0a2a5e">
<meta name="author" content="jltaboada">

<meta property="og:type" content="website">
<meta property="og:title" content="Festas de Ourense 2026 · Programa">
<meta property="og:description" content="Do 17 ao 21 de xuño. Concertos, espectáculos, atraccións e moito máis.">
<meta property="og:image" content="img/og.jpg">
<meta property="og:locale" content="gl_ES">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/png" href="img/icon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Festas '26">

<style>
  :root{
    --azul:#0a2a5e; --azul-2:#10408a; --azul-claro:#2a6fd6;
    --rosa:#f25fa6; --rosa-claro:#ffb6d9; --amarelo:#ffd233;
    --turquesa:#37c9b8; --laranxa:#ff7a3c;
    --radio:20px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
    --bg:radial-gradient(circle at 12% 8%, rgba(55,201,184,.18), transparent 38%),
         radial-gradient(circle at 88% 4%, rgba(242,95,166,.20), transparent 40%),
         radial-gradient(circle at 50% 100%, rgba(255,210,51,.12), transparent 45%),
         linear-gradient(180deg,#06204c 0%,#0a2a5e 35%,#10408a 100%);
    --titulo:#ffffff; --sub:#dfe9ff; --footer:#cdd9f5; --footer-soft:#9fb3dd;
    --card:#ffffff; --texto:#1a2238;
    --topbar-bg:rgba(6,28,68,.94); --topbar-border:rgba(255,255,255,.12); --topbar-text:#eaf1ff;
    --control-bg:rgba(255,255,255,.10); --control-text:#ffffff; --control-border:rgba(255,255,255,.18);
    --detalle:#445; --sombra:0 8px 24px rgba(8,24,60,.16);
  }
  [data-theme="light"]{
    --bg:radial-gradient(circle at 12% 8%, rgba(55,201,184,.16), transparent 40%),
         radial-gradient(circle at 88% 4%, rgba(242,95,166,.16), transparent 42%),
         linear-gradient(180deg,#eef4ff 0%,#dfeaff 55%,#d2e2ff 100%);
    --titulo:#0a2a5e; --sub:#33507f; --footer:#33507f; --footer-soft:#6378a6;
    --card:#ffffff; --texto:#1a2238;
    --topbar-bg:rgba(255,255,255,.92); --topbar-border:rgba(10,42,94,.12); --topbar-text:#0a2a5e;
    --control-bg:rgba(10,42,94,.06); --control-text:#0a2a5e; --control-border:rgba(10,42,94,.16);
    --detalle:#566; --sombra:0 8px 22px rgba(8,24,60,.12);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:'Trebuchet MS','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    color:var(--texto);background:var(--bg);background-attachment:fixed;
    min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5;transition:background .3s;
  }

  /* ============ LANDING ============ */
  #landing{
    position:fixed;inset:0;z-index:200;overflow-y:auto;
    background:
      radial-gradient(circle at 15% 10%, rgba(55,201,184,.22), transparent 40%),
      radial-gradient(circle at 85% 6%, rgba(242,95,166,.24), transparent 42%),
      linear-gradient(180deg,#06204c,#0a2a5e 60%,#10408a);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:calc(var(--safe-top) + 30px) 20px calc(var(--safe-bot) + 30px);
    transition:opacity .45s ease, transform .45s ease;
  }
  #landing.hide{opacity:0;transform:scale(1.03);pointer-events:none}
  .land-deco{position:absolute;width:150px;opacity:.5;pointer-events:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
  .land-deco.l{top:6px;left:-44px;transform:rotate(-8deg)}
  .land-deco.r{bottom:30px;right:-46px;transform:scaleX(-1) rotate(-6deg);width:130px}
  .land-lang{
    position:absolute;top:calc(var(--safe-top) + 12px);right:14px;z-index:3;display:flex;gap:8px;
  }
  .land-lang button{
    cursor:pointer;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.10);
    color:#fff;font-family:inherit;font-weight:800;font-size:.8rem;padding:7px 12px;border-radius:999px;transition:transform .15s;
  }
  .land-lang button:active{transform:scale(.92)}
  .badge-no-oficial{
    display:inline-block;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--azul);background:var(--amarelo);padding:5px 13px;border-radius:999px;
    font-weight:800;margin-bottom:18px;box-shadow:0 3px 10px rgba(0,0,0,.3);position:relative;z-index:2;
  }
  .cartel{
    max-width:330px;width:80%;border-radius:18px;display:block;margin:0 auto 24px;
    box-shadow:0 18px 48px rgba(0,0,0,.5);border:3px solid rgba(255,255,255,.85);position:relative;z-index:2;
  }
  #landing h1{font-size:2.4rem;line-height:1;color:var(--amarelo);position:relative;z-index:2;text-shadow:0 3px 0 var(--rosa),0 6px 14px rgba(0,0,0,.4)}
  #landing h1 .l2{display:block;color:var(--turquesa);font-size:1.5rem;text-shadow:0 2px 0 #06204c,0 4px 10px rgba(0,0,0,.4)}
  .land-datas{
    display:inline-block;margin-top:16px;background:var(--rosa-claro);color:var(--azul);
    font-weight:800;font-size:1.02rem;padding:8px 22px;border-radius:999px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);position:relative;z-index:2;
  }
  .btn-programa{
    margin-top:28px;position:relative;z-index:2;cursor:pointer;border:none;
    font-family:inherit;font-size:1.15rem;font-weight:800;color:var(--azul);
    background:linear-gradient(180deg,var(--amarelo),#ffc400);
    padding:16px 38px;border-radius:999px;box-shadow:0 8px 22px rgba(255,210,51,.45);transition:transform .15s, box-shadow .15s;
  }
  .btn-programa:active{transform:scale(.96)}
  .land-nota{margin-top:26px;color:#aebfe6;font-size:.78rem;position:relative;z-index:2;max-width:340px}
  .land-nota a{color:var(--amarelo);font-weight:700;text-decoration:none}
  .btn-instalar{
    display:none;margin-top:18px;position:relative;z-index:2;cursor:pointer;
    border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.10);color:#fff;
    font-family:inherit;font-size:.92rem;font-weight:700;padding:11px 22px;border-radius:999px;
    align-items:center;gap:8px;transition:transform .15s,background .15s;
  }
  .btn-instalar.show{display:inline-flex}
  .btn-instalar:active{transform:scale(.96)}

  /* ============ APP ============ */
  #app{display:none}
  #app.show{display:block}
  .topbar{
    position:sticky;top:0;z-index:80;background:var(--topbar-bg);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--topbar-border);
    padding:calc(var(--safe-top) + 8px) 14px 12px;box-shadow:0 6px 18px rgba(0,0,0,.18);
  }
  .tb-row1{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .home-btn{display:flex;align-items:center;gap:8px;cursor:pointer;border:none;background:transparent;
    color:var(--topbar-text);font-family:inherit;font-weight:800;font-size:1rem;padding:4px 4px}
  .home-btn img{width:30px;height:30px;border-radius:8px;border:1.5px solid rgba(255,255,255,.4)}
  .home-btn .tt{line-height:1;text-align:left}
  .home-btn .tt small{display:block;font-size:.62rem;font-weight:600;opacity:.8}
  .tb-actions{margin-left:auto;display:flex;gap:8px}
  .icon-btn{
    cursor:pointer;border:1px solid var(--control-border);background:var(--control-bg);color:var(--control-text);
    height:40px;border-radius:12px;display:grid;place-items:center;transition:transform .15s;font-family:inherit;
  }
  .icon-btn:active{transform:scale(.9)}
  .theme-btn{width:40px;font-size:1.15rem}
  .lang-btn{padding:0 13px;font-size:.82rem;font-weight:800;letter-spacing:.03em}
  .controls{display:flex;flex-direction:column;gap:9px}
  .sel-wrap{position:relative}
  .sel-wrap::after{content:"▾";position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--control-text);opacity:.8}
  select#sel{
    width:100%;appearance:none;-webkit-appearance:none;font-family:inherit;font-weight:700;font-size:1rem;
    color:var(--control-text);background:var(--control-bg);border:1.5px solid var(--control-border);
    border-radius:14px;padding:12px 38px 12px 14px;cursor:pointer;
  }
  select#sel option, select#sel optgroup{color:#1a2238;background:#fff}
  .search-wrap{position:relative}
  .search-wrap .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.7;font-size:.95rem}
  input#busca{
    width:100%;font-family:inherit;font-size:.95rem;color:var(--control-text);background:var(--control-bg);
    border:1.5px solid var(--control-border);border-radius:14px;padding:11px 38px 11px 36px;
  }
  input#busca::placeholder{color:var(--control-text);opacity:.55}
  .clear-busca{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;
    color:var(--control-text);font-size:1.1rem;cursor:pointer;padding:6px;display:none}
  .clear-busca.show{display:block}

  main{max-width:680px;margin:0 auto;padding:20px 16px calc(48px + var(--safe-bot))}
  .seccion-titulo{display:flex;align-items:center;gap:10px;margin:6px 4px 16px;color:var(--titulo)}
  .seccion-titulo h2{font-size:1.3rem;letter-spacing:.3px}
  .seccion-titulo .em{font-size:1.45rem}
  .seccion-titulo .liña{flex:1;height:2px;background:linear-gradient(90deg,var(--amarelo),transparent);border-radius:2px}
  .dia-data{
    text-align:center;color:var(--azul);font-weight:800;margin:0 0 18px;
    background:linear-gradient(180deg,var(--amarelo),#ffc400);
    padding:12px;border-radius:var(--radio);box-shadow:var(--sombra);font-size:1.12rem;
  }
  .dia-data small{display:block;font-weight:600;font-size:.78rem;color:var(--azul-2);opacity:.9}
  .info-banner{
    background:linear-gradient(135deg,var(--turquesa),var(--azul-claro));
    color:#fff;border-radius:var(--radio);padding:16px;margin:0 0 16px;box-shadow:var(--sombra);text-align:center;
  }
  .info-banner h3{font-size:1.02rem;margin-bottom:5px}
  .info-banner p{font-size:.85rem;opacity:.95}

  .evento{
    background:var(--card);border-radius:var(--radio);padding:15px 15px 13px;margin-bottom:13px;
    box-shadow:var(--sombra);position:relative;overflow:hidden;border-left:6px solid var(--rosa);animation:fade .3s ease;
  }
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .evento.tipo-musica{border-left-color:var(--rosa)}
  .evento.tipo-espectaculo{border-left-color:var(--laranxa)}
  .evento.tipo-deporte{border-left-color:var(--turquesa)}
  .evento.tipo-infantil{border-left-color:var(--amarelo)}
  .evento.tipo-permanente{border-left-color:var(--azul-claro)}
  .ev-top{display:flex;gap:13px;align-items:flex-start}
  .ev-icon{flex:0 0 auto;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:1.5rem;background:#f3f6ff}
  .ev-body{flex:1;min-width:0;padding-right:38px}
  .ev-titulo{font-size:1.06rem;font-weight:800;color:var(--azul);line-height:1.2}
  .fav-btn{position:absolute;top:10px;right:10px;border:none;background:transparent;cursor:pointer;
    font-size:1.5rem;line-height:1;color:#c9d2e6;transition:transform .15s,color .15s;padding:2px}
  .fav-btn.on{color:var(--amarelo);text-shadow:0 1px 4px rgba(230,168,0,.5)}
  .fav-btn:active{transform:scale(1.3)}
  .ev-detalle{margin-top:8px;font-size:.85rem;color:var(--detalle);line-height:1.55}
  .ev-detalle b{color:var(--azul)}
  .ev-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:.77rem;font-weight:600;
    padding:4px 10px;border-radius:999px;white-space:nowrap;text-decoration:none}
  .chip.hora{background:#fff0d6;color:#9a6800}
  .chip.lugar{background:#e7faf7;color:#0c7a6e;cursor:pointer;transition:background .15s;white-space:normal}
  .chip.lugar:active{background:#cdf2ec}
  .chip.dia{background:#eef0ff;color:#41499a}
  .chip.tipo{color:#fff}
  .chip.tipo.tipo-musica{background:var(--rosa)}
  .chip.tipo.tipo-espectaculo{background:var(--laranxa)}
  .chip.tipo.tipo-deporte{background:var(--turquesa)}
  .chip.tipo.tipo-infantil{background:#e0a800}
  .chip.tipo.tipo-permanente{background:var(--azul-claro)}

  /* acciones como ICONOS, a todo o ancho */
  .ev-acciones{display:flex;gap:8px;margin-top:12px}
  .acc-btn{
    flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;
    border:1.5px solid #dfe5f2;background:#f6f8ff;color:var(--azul);height:42px;border-radius:12px;
    cursor:pointer;transition:background .15s,transform .12s;text-decoration:none;
  }
  .acc-btn svg{width:21px;height:21px;display:block}
  .acc-btn:active{transform:scale(.95)}
  .acc-btn.cal{background:#eef6ff;border-color:#cfe2ff;color:#1565c0}
  .acc-btn.mapa{background:#e7faf7;border-color:#b9ece4;color:#0c7a6e}
  .acc-btn.share{background:#fdeef6;border-color:#ffcfe6;color:#b32b78}

  .ev-live{display:inline-flex;align-items:center;gap:6px;margin-top:9px;background:#e8202e;color:#fff;
    font-size:.74rem;font-weight:800;letter-spacing:.04em;padding:4px 11px;border-radius:999px;
    text-transform:uppercase;box-shadow:0 2px 10px rgba(232,32,46,.4)}
  .ev-live .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
  .evento.is-live{box-shadow:0 0 0 2px #e8202e, var(--sombra)}

  .empty{text-align:center;background:var(--card);color:var(--texto);border-radius:var(--radio);
    padding:34px 22px;box-shadow:var(--sombra);margin-top:6px}
  .empty .big{font-size:2.6rem;display:block;margin-bottom:10px}
  .empty h3{color:var(--azul);font-size:1.1rem;margin-bottom:6px}
  .empty p{font-size:.88rem;color:var(--detalle)}

  footer{text-align:center;color:var(--footer);padding:32px 20px calc(40px + var(--safe-bot));
    font-size:.85rem;border-top:1px solid var(--topbar-border);margin-top:20px;position:relative;overflow:hidden}
  footer .deco-foot{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);width:220px;opacity:.16;pointer-events:none}
  footer .rel{position:relative;z-index:2}
  footer .oficial{margin-top:6px;font-size:.8rem}
  footer .oficial a{color:var(--footer);text-decoration:underline}
  footer .firma{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:var(--control-bg);
    color:var(--footer);padding:9px 18px;border-radius:999px;border:1px solid var(--control-border)}
  footer .firma a{color:var(--titulo);font-weight:700;text-decoration:none}
  footer .creditos{margin-top:14px;font-size:.77rem;color:var(--footer-soft)}

  #toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-bot));transform:translateX(-50%) translateY(20px);
    background:#0a2a5e;color:#fff;padding:12px 20px;border-radius:14px;font-size:.88rem;font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:300;opacity:0;pointer-events:none;
    transition:opacity .25s, transform .25s;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .top-btn{position:fixed;right:16px;bottom:calc(18px + var(--safe-bot));z-index:60;width:46px;height:46px;
    border-radius:50%;border:none;cursor:pointer;background:var(--rosa);color:#fff;font-size:1.25rem;
    box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;transform:translateY(10px)}
  .top-btn.show{opacity:1;pointer-events:auto;transform:none}

  @media(min-width:560px){
    #landing h1{font-size:3rem}
    #landing h1 .l2{font-size:1.9rem}
    .cartel{max-width:360px}
  }
</style>
</head>
<body>

<!-- ============ LANDING ============ -->
<section id="landing">
  <div class="land-lang">
    <button id="langGl" aria-label="Galego">GL</button>
    <button id="langEs" aria-label="Castellano">ES</button>
  </div>
  <img src="img/fireworks2.png" alt="" class="land-deco l" aria-hidden="true">
  <img src="img/fireworks2.png" alt="" class="land-deco r" aria-hidden="true">
  <span class="badge-no-oficial" id="badgeNoOficial">Programa non oficial</span>
  <img src="img/cartel.jpg" alt="Cartel das Festas de Ourense 2026" class="cartel">
  <h1><span class="l1" id="landH1a">Festas de</span><span class="l2" id="landH1b">Ourense 2026</span></h1>
  <div class="land-datas" id="landDatas">🗓️ Do 17 ao 21 de xuño</div>
  <button class="btn-programa" id="verPrograma">Ver programa →</button>
  <button class="btn-instalar" id="btnInstalar">📲 Instalar a app</button>
  <p class="land-nota" id="landNota"></p>
</section>

<!-- ============ APP ============ -->
<div id="app">
  <div class="topbar">
    <div class="tb-row1">
      <button class="home-btn" id="homeBtn" aria-label="Inicio">
        <img src="img/icon.png" alt="">
        <span class="tt"><span id="brand">Festas '26</span><small id="brandSub">Ourense · 17–21 xuño</small></span>
      </button>
      <div class="tb-actions">
        <button class="icon-btn lang-btn" id="langBtn" aria-label="Cambiar idioma">ES</button>
        <button class="icon-btn theme-btn" id="themeBtn" aria-label="Cambiar tema">🌙</button>
      </div>
    </div>
    <div class="controls">
      <div class="sel-wrap">
        <select id="sel" aria-label="Sección"></select>
      </div>
      <div class="search-wrap">
        <span class="ic">🔍</span>
        <input id="busca" type="search" inputmode="search" placeholder="Buscar evento ou lugar…" autocomplete="off">
        <button class="clear-busca" id="clearBusca" aria-label="Limpar busca">✕</button>
      </div>
    </div>
  </div>

  <main id="contido"></main>

  <footer>
    <img src="img/fireworks.png" alt="" class="deco-foot" aria-hidden="true">
    <div class="rel">
      <p id="footTitulo"></p>
      <p class="oficial" id="footOficial"></p>
      <div class="firma" id="footFirma"></div>
      <p class="creditos" id="footCreditos"></p>
    </div>
  </footer>
</div>

<button class="top-btn" id="topBtn" aria-label="Arriba">↑</button>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= I18N ================= */
const I18N={
  gl:{
    badge_no_oficial:'Programa non oficial',
    land_h1a:'Festas de', land_h1b:'Ourense 2026',
    land_datas:'🗓️ Do 17 ao 21 de xuño',
    ver_programa:'Ver programa →',
    instalar:'📲 Instalar a app',
    land_nota:'Proxecto persoal de <a href="https://jltaboada.com" target="_blank" rel="noopener">jltaboada.com</a> · non oficial.<br>Programa oficial en <a href="https://ourense.gal/media/filer_public/a7/57/a7576ef6-337f-4a50-9065-f22492a409ab/festasourense2026programa.pdf" target="_blank" rel="noopener">ourense.gal (PDF) ↗</a>',
    brand:"Festas '26", brand_sub:'Ourense · 17–21 xuño',
    aria_idioma:'Cambiar idioma', aria_tema:'Cambiar tema', aria_inicio:'Inicio', aria_arriba:'Volver arriba',
    aria_seccion:'Sección', aria_limpar:'Limpar busca', aria_fav:'Gardar en favoritos',
    buscar_ph:'Buscar evento ou lugar…',
    og_eventos:'⭐ Os meus eventos', opt_favoritos:'★ Favoritos',
    og_dia:'📅 Por día', og_perm:'🎪 Durante toda a festa', opt_perm:'Actividades permanentes',
    sec_resultados:'Resultados', sec_favoritos:'Os meus favoritos', sec_permanente:'Durante toda a festa',
    banner_h:'🎪 Aberto os 5 días', banner_p:'Mercado Medieval, atraccións e xogos acuáticos do 17 ao 21 de xuño.',
    fav_vacio_h:'Aínda non tes favoritos', fav_vacio_p:'Toca a estrela ☆ en calquera evento para gardalo aquí e telo sempre á man.',

function eventoHTML(ev,showDia){

  const fav=FAVS.has(ev.id), live=isLive(ev);
  let chips=`<span class="chip tipo tipo-${ev.tipo}">${t.ic} ${tag}</span>`;
  if(showDia && ev.diaId!=='permanente') chips+=`<span class="chip dia">📅 ${tr(ev.diaNome)} ${ev.diaNum}</span>`;
  if(ev.hora) chips+=`<span class="chip hora">🕐 ${ev.hora}</span>`;
  if(lugar) chips+=`<a class="chip lugar" href="${mapsUrl(lugar)}" target="_blank" rel="noopener" title="${T('t_mapa_chip')}">📍 ${esc(lugar)} ↗</a>`;
  const detalle=detalleTxt?`<div class="ev-detalle">${detalleTxt}</div>`:'';
  const liveBadge=live?`<div class="ev-live"><span class="dot"></span>${T('en_directo')}</div>`:'';
  const cal=(ev.baseYmd&&ev.hora)?`<button class="acc-btn cal" data-cal="${ev.id}" aria-label="${T('t_cal')}" title="${T('t_cal')}">${SVG.cal}</button>`:'';

  return `<article class="evento tipo-${ev.tipo}${live?' is-live':''}" data-id="${ev.id}">
    <button class="fav-btn ${fav?'on':''}" data-fav="${ev.id}" aria-label="${T('aria_fav')}" title="${T('aria_fav')}">${fav?'★':'☆'}</button>
    <div class="ev-top">

        <div class="ev-titulo">${esc(titulo)}</div>
        ${liveBadge}

}

function isLive(ev){
  const now=new Date();
  if(ev.diaId==='permanente'){const ini=new Date(2026,5,17,11,0),fin=new Date(2026,5,22,1,0);return now>=ini&&now<=fin;}
  const dts=horaToDates(ev); if(!dts) return false;
  return now>=dts.start && now<=dts.end;
}

function currentList(){
  if(state.q.trim()){
    const q=norm(state.q);
    return ALL_EVENTS.filter(e=>norm(tr(e.titulo)).includes(q)||norm(tr(e.lugar)).includes(q)||norm(tr(TIPOS[e.tipo].tag)).includes(q));
  }
  if(state.mode==='favoritos') return ALL_EVENTS.filter(e=>FAVS.has(e.id));
  if(state.mode==='permanente') return ALL_EVENTS.filter(e=>e.diaId==='permanente');
  return ALL_EVENTS.filter(e=>e.diaId===state.mode);
}

/* ================= CALENDARIO ================= */
function mkDate(ymd,h,m){return new Date(+ymd.slice(0,4),+ymd.slice(4,6)-1,+ymd.slice(6,8),h,m);}
function horaToDates(ev){
  const times=(ev.hora||'').match(/(\d{1,2})\.(\d{2})/g)||[];
  if(!times.length||!ev.baseYmd) return null;
  const [sh,sm]=times[0].split('.').map(Number);
  let start=mkDate(ev.baseYmd,sh,sm); if(sh<7) start.setDate(start.getDate()+1);
  let end;
  if(times[1]){const [eh,em]=times[1].split('.').map(Number);end=mkDate(ev.baseYmd,eh,em);if(eh<7)end.setDate(end.getDate()+1);if(end<=start)end.setDate(end.getDate()+1);}
  else{end=new Date(start.getTime()+90*60000);}
  return {start,end};
}
function p2(n){return String(n).padStart(2,'0');}
function fmtLocal(d){return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'T'+p2(d.getHours())+p2(d.getMinutes())+'00';}
function fmtUTC(d){return d.getUTCFullYear()+p2(d.getUTCMonth()+1)+p2(d.getUTCDate())+'T'+p2(d.getUTCHours())+p2(d.getUTCMinutes())+p2(d.getUTCSeconds())+'Z';}
function icsEsc(s){return (s||'').replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\n/g,'\\n');}
function descargarICS(id){
  const ev=ALL_EVENTS.find(e=>e.id===id); if(!ev) return;
  const dts=horaToDates(ev); if(!dts) return;
  const lugar=tr(ev.lugar);
  const loc=lugar?lugar+', Ourense':'Ourense';
  const ics=[
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//jltaboada//Festas Ourense 2026//'+LANG.toUpperCase(),'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT','UID:'+id+'@festasourense2026','DTSTAMP:'+fmtUTC(new Date()),
    'DTSTART:'+fmtLocal(dts.start),'DTEND:'+fmtLocal(dts.end),
    'SUMMARY:'+icsEsc(tr(ev.titulo)),'LOCATION:'+icsEsc(loc),'DESCRIPTION:'+icsEsc(T('cal_desc')),
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='festas-ourense-'+id+'.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast(T('toast_cal'));
}

/* ================= COMPARTIR ================= */
async function compartir(id){
  const ev=ALL_EVENTS.find(e=>e.id===id); if(!ev) return;
  const dia=ev.diaId==='permanente'?T('share_toda'):(tr(ev.diaNome)+' '+ev.diaNum+' '+T('de_mes'));
  const titulo=tr(ev.titulo), lugar=tr(ev.lugar);
  const partes=[`🎉 ${titulo}`,`📅 ${dia}`];
  if(ev.hora) partes.push(`🕐 ${ev.hora}`);
  if(lugar) partes.push(`📍 ${lugar}`);
  partes.push('',T('share_festa'));
  const url=location.origin+location.pathname+'#'+ev.diaId+'/'+ev.id;
  const texto=partes.join('\n');
  const shareData={title:T('share_festa')+' · '+titulo,text:texto,url};
  try{ if(navigator.share){await navigator.share(shareData);return;} }
  catch(err){ if(err&&err.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(texto+'\n'+url); toast(T('toast_copy')); }
  catch(e){ prompt(T('prompt_share'), texto+'\n'+url); }
}

/* ================= TOAST ================= */
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}

/* ================= TEMA ================= */
function applyTheme(th){
  document.documentElement.setAttribute('data-theme',th);
  document.getElementById('themeBtn').textContent=th==='dark'?'🌙':'☀️';
  document.querySelector('meta[name=theme-color]').setAttribute('content',th==='dark'?'#0a2a5e':'#eef4ff');
  try{localStorage.setItem(LS_THEME,th);}catch(e){}
}
(function(){let th='dark';try{th=localStorage.getItem(LS_THEME)||'dark';}catch(e){}applyTheme(th);})();

/* ================= IDIOMA ================= */
function buildSelect(){
  const cur=state.mode;
  sel.innerHTML=`
    <optgroup label="${T('og_eventos')}"><option value="favoritos">${T('opt_favoritos')}</option></optgroup>
    <optgroup label="${T('og_dia')}">
      <option value="mer">${tr(DIA_INFO.mer.nome)} 17 ${T('de_mes')}</option>
      <option value="xov">${tr(DIA_INFO.xov.nome)} 18 ${T('de_mes')}</option>
      <option value="ven">${tr(DIA_INFO.ven.nome)} 19 ${T('de_mes')}</option>
      <option value="sab">${tr(DIA_INFO.sab.nome)} 20 ${T('de_mes')}</option>
      <option value="dom">${tr(DIA_INFO.dom.nome)} 21 ${T('de_mes')}</option>
    </optgroup>
    <optgroup label="${T('og_perm')}"><option value="permanente">${T('opt_perm')}</option></optgroup>`;
  sel.value=cur;
  updateFavOption();
}
function setHtml(id,html){const el=document.getElementById(id);if(el)el.innerHTML=html;}
function setText(id,txt){const el=document.getElementById(id);if(el)el.textContent=txt;}
function setAttr(id,attr,val){const el=document.getElementById(id);if(el)el.setAttribute(attr,val);}

function applyI18n(){
  document.documentElement.setAttribute('lang',LANG);
  document.querySelector('meta[property="og:locale"]').setAttribute('content',LANG==='gl'?'gl_ES':'es_ES');
  // landing
  setText('badgeNoOficial',T('badge_no_oficial'));
  setText('landH1a',T('land_h1a')); setText('landH1b',T('land_h1b'));
  setText('landDatas',T('land_datas'));
  setText('verPrograma',T('ver_programa'));
  setText('btnInstalar',T('instalar'));
  setHtml('landNota',T('land_nota'));
  // topbar
  setText('brand',T('brand')); setText('brandSub',T('brand_sub'));
  setAttr('langBtn','aria-label',T('aria_idioma')); setAttr('themeBtn','aria-label',T('aria_tema'));
  setAttr('homeBtn','aria-label',T('aria_inicio')); setAttr('topBtn','aria-label',T('aria_arriba'));
  setAttr('sel','aria-label',T('aria_seccion')); setAttr('clearBusca','aria-label',T('aria_limpar'));
  document.getElementById('langBtn').textContent = LANG==='gl'?'ES':'GL';
  document.getElementById('busca').setAttribute('placeholder',T('buscar_ph'));
  // footer
  setHtml('footTitulo',T('foot_titulo')); setHtml('footOficial',T('foot_oficial'));
  setHtml('footFirma',T('foot_firma')); setHtml('footCreditos',T('foot_creditos'));
  // landing lang botóns: marcar activo
  document.getElementById('langGl').style.opacity=LANG==='gl'?'1':'.55';
  document.getElementById('langEs').style.opacity=LANG==='es'?'1':'.55';
  buildSelect();
  render();
}
function setLang(l){
  if(l!==LANG){LANG=l;try{localStorage.setItem(LS_LANG,l);}catch(e){}applyI18n();}
}

/* ================= UI ================= */
const landing=document.getElementById('landing');
const app=document.getElementById('app');
const sel=document.getElementById('sel');
const busca=document.getElementById('busca');
const clearBusca=document.getElementById('clearBusca');

function abrirPrograma(){landing.classList.add('hide');setTimeout(()=>{landing.style.display='none';},450);app.classList.add('show');window.scrollTo(0,0);}
function volverCartel(){landing.style.display='flex';requestAnimationFrame(()=>landing.classList.remove('hide'));app.classList.remove('show');window.scrollTo(0,0);}
document.getElementById('verPrograma').addEventListener('click',abrirPrograma);
document.getElementById('homeBtn').addEventListener('click',volverCartel);

document.getElementById('langGl').addEventListener('click',()=>setLang('gl'));
document.getElementById('langEs').addEventListener('click',()=>setLang('es'));
document.getElementById('langBtn').addEventListener('click',()=>setLang(LANG==='gl'?'es':'gl'));
document.getElementById('themeBtn').addEventListener('click',()=>{applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');});

sel.addEventListener('change',()=>{
  state.mode=sel.value;
  busca.value='';state.q='';clearBusca.classList.remove('show');
  render();window.scrollTo({top:0,behavior:'smooth'});
});
busca.addEventListener('input',()=>{state.q=busca.value;clearBusca.classList.toggle('show',!!busca.value);render();});
clearBusca.addEventListener('click',()=>{busca.value='';state.q='';clearBusca.classList.remove('show');busca.focus();render();});

document.getElementById('contido').addEventListener('click',e=>{
  const fav=e.target.closest('[data-fav]'); if(fav){toggleFav(fav.dataset.fav);return;}
  const cal=e.target.closest('[data-cal]'); if(cal){descargarICS(cal.dataset.cal);return;}
  const sh=e.target.closest('[data-share]'); if(sh){compartir(sh.dataset.share);return;}
});

const topBtn=document.getElementById('topBtn');
window.addEventListener('scroll',()=>{topBtn.classList.toggle('show',window.scrollY>500&&app.classList.contains('show'));});
topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

/* ================= PWA: SW + AUTO-ACTUALIZACIÓN ================= */
if('serviceWorker' in navigator){
  let refreshing=false;
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    // Só recargamos cando se actualiza unha versión xa existente (non na 1ª instalación)
    if(hadController && !refreshing){refreshing=true;toast(T('toast_update'));setTimeout(()=>location.reload(),700);}
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      // comprobar actualizacións ao abrir e periodicamente
      reg.update();
      setInterval(()=>reg.update(),60*60*1000);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update();});
    }).catch(()=>{});
  });
}

/* ================= PWA: INSTALAR ================= */
let deferredPrompt=null;
const btnInstalar=document.getElementById('btnInstalar');
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;btnInstalar.classList.add('show');});
btnInstalar.addEventListener('click',async()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const {outcome}=await deferredPrompt.userChoice;
  deferredPrompt=null;btnInstalar.classList.remove('show');
  if(outcome==='accepted') toast(T('toast_install'));
});
window.addEventListener('appinstalled',()=>{btnInstalar.classList.remove('show');toast(T('toast_installed'));});
if(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone){btnInstalar.classList.remove('show');}

/* ================= DEEP LINK ================= */
function aplicarHash(){
  const h=location.hash.replace(/^#/,''); if(!h) return false;
  const [seccion,evId]=h.split('/');
  const validas=['favoritos','permanente','mer','xov','ven','sab','dom'];
  if(!validas.includes(seccion)) return false;
  abrirPrograma();
  sel.value=seccion;state.mode=seccion;state.q='';busca.value='';clearBusca.classList.remove('show');
  render();
  if(evId){setTimeout(()=>{
    const el=document.querySelector('.evento[data-id="'+CSS.escape(evId)+'"]');
    if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.transition='box-shadow .3s';el.style.boxShadow='0 0 0 3px var(--amarelo), var(--sombra)';setTimeout(()=>{el.style.boxShadow='';},2200);}
  },120);}
  return true;
}
window.addEventListener('hashchange',aplicarHash);

/* ================= REFRESCO EN DIRECTO ================= */
setInterval(()=>{if(app.classList.contains('show'))render();},60000);

/* ================= INIT ================= */
applyI18n();
aplicarHash();
</script>
</body>
</html>
